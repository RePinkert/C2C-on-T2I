<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>盲评：raw / t2t / c2c</title>
<style>
:root{--bg:#12151a;--card:#1b2028;--txt:#e8ecf3;--dim:#8b95a7;--acc:#3b82f6;--ok:#22c55e;--warn:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt)}
.top{position:sticky;top:0;z-index:20;background:rgba(18,21,26,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid #242b36;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.top b{font-size:15px;margin-right:auto}
.hint{color:var(--dim);font-size:12px;width:100%;margin-top:-2px}
#who{padding:7px 10px;border-radius:8px;border:1px solid #2c3442;background:#151a21;color:var(--txt);font-size:13px;width:170px}
.btn{background:#21304a;border:0;color:#cfe0ff;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer}
.btn:hover{background:#2a3f5f}
.btn.warn{background:#3d2a1a;color:#ffd9a0}
.btn.submit{background:#123a22;border:1px solid #22c55e;color:#7ee2a8;font-weight:700;opacity:.4;cursor:not-allowed}
.btn.submit.ready{opacity:1;cursor:pointer;background:#14532d}
.btn.submit.ready:hover{background:#166534}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{height:5px;background:#222a35;border-radius:3px;overflow:hidden;margin:10px 16px 0}
.bar>div{height:100%;background:var(--acc);width:0%;transition:width .25s}
#loading{color:var(--dim);text-align:center;padding:80px 20px;font-size:15px}
.err{color:#fca5a5;font-size:13px;margin-top:6px;width:100%}
.done-banner{display:none;margin:14px 16px 0;padding:14px 16px;border:1px solid #14532d;background:#0f2419;
  border-radius:12px;color:#86efac;font-size:14px}
#root{max-width:1080px;margin:0 auto;padding:16px}
.item{background:var(--card);border:1px solid #242b36;border-radius:14px;padding:16px 18px;margin-bottom:18px}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:12px}
.meta .idx{color:var(--dim);font-size:12px;white-space:nowrap}
.prompt{font-size:15px;line-height:1.6;color:#bcd3ff;word-break:break-word}
.imgs{display:flex;gap:12px;margin:12px 0}
.imgs figure{flex:1;text-align:center}
.imgs img{width:100%;max-height:56vh;object-fit:contain;border:2px solid #2c3442;border-radius:10px;background:#0c0f14}
.imgs figcaption{color:var(--dim);font-size:12px;margin-top:6px}
.q{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.q .qt{min-width:150px;font-size:13px;color:var(--dim)}
.opt{background:#222b38;border:1px solid #2c3442;color:var(--txt);border-radius:8px;
  padding:8px 16px;font-size:14px;cursor:pointer;min-width:88px}
.opt:hover{border-color:#3b82f6}
.opt.sel{background:var(--ok);border-color:var(--ok);color:#052e12;font-weight:700}
.done{color:var(--ok);font-size:13px;margin-left:8px}
@media (max-width:760px){
  .imgs{flex-direction:column}
  .imgs img{max-height:38vh}
  .q .qt{min-width:100%;margin-bottom:4px}
  #who{width:100%}
}
</style></head><body>
<div class="top">
  <b>盲评：raw / t2t / c2c</b>
  <input id="who" placeholder="昵称（仅用于区分问卷）" maxlength="30">
  <button id="submitBtn" class="btn submit" onclick="submitSurvey()" disabled>提交结果</button>
  <button class="btn" onclick="exportCSV()">导出 CSV</button>
  <button class="btn warn" onclick="reloadAll()">换一批（重新抽取）</button>
  <span id="prog"></span>
  <div class="hint">每对图回答两个问题（忠实度 / 观感），三选一。左右顺序与题目集合随机化，每次打开都不同。所有作答仅存于当前标签页，刷新或关闭即清空。答完 21/21 后点“提交结果”即自动回传。</div>
  <div class="err" id="errline" style="display:none"></div>
</div>
<div id="doneBanner" class="done-banner">✓ 已收到，感谢反馈！<span id="doneSeq"></span><br>需要自己的备份可再点上方“导出 CSV”。</div>
<div class="bar"><div id="barfill"></div></div>
<div id="loading">正在加载图池并随机抽取 21 对…</div>
<div id="root"></div>
<script>
const SUBMIT_URL = 'https://script.google.com/macros/s/AKfycbyFsi0LGGeQI-mDsBzHc0XjsC3aUF4dpeFurZHAUSgYuo480B0vrbsyuI7EbxLhcorZeg/exec';
const COMPARISONS = ['raw_vs_c2c','raw_vs_t2t','t2t_vs_c2c'];
const PER_COMP = 7;
const ZH = new Set(['p08','p09','p10','p11','p12','p13','p14','p22','p23','p24','p25','p27']);
let items = [], votes = {}, exported = false, submitted = false, submitting = false;

function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

fetch('pool.json' + '?_=' + Date.now()).then(r=>{ if(!r.ok) throw new Error('pool.json '+r.status); return r.json(); })
.then(pool=>{
  const byPid = {};
  pool.cells.forEach(c=>{ (byPid[c.pid] = byPid[c.pid] || []).push(c); });
  const pids = shuffle(Object.keys(byPid));
  const groups = {raw_vs_c2c:[], raw_vs_t2t:[], t2t_vs_c2c:[]};
  const names = ['raw_vs_c2c','raw_vs_t2t','t2t_vs_c2c'];
  const chosen = pids.slice(0, PER_COMP * COMPARISONS.length);
  for (let k = 0; k < chosen.length; k++) groups[names[k % 3]].push(chosen[k]);
  const zhCount = g => g.filter(p=>ZH.has(p)).length;
  // zh balance: every group keeps exactly 7 items; swap a zh prompt in if needed
  for (const c of COMPARISONS){
    while (zhCount(groups[c]) < 2){
      const donor = COMPARISONS.find(o => o !== c && zhCount(groups[o]) > 2);
      if (!donor) break;
      const p = groups[donor].find(x => ZH.has(x));
      const q = groups[c].find(x => !ZH.has(x));
      if (!p || !q) break;
      groups[donor][groups[donor].indexOf(p)] = q;
      groups[c][groups[c].indexOf(q)] = p;
    }
  }
  for (const c of COMPARISONS){
    const [a,b] = c.split('_vs_');
    for (const pid of groups[c]){
      const cell = byPid[pid][Math.floor(Math.random()*byPid[pid].length)];
      const flip = Math.random() < 0.5;
      const left = flip ? b : a, right = flip ? a : b;
      items.push({ id: cell.id, pid, prompt: cell.prompt,
                   left: cell[left], right: cell[right],
                   truth: { left, right } });
    }
  }
  shuffle(items);
  render();
}).catch(err=>{ document.getElementById('loading').textContent = '加载失败：' + err.message; });

const root = document.getElementById('root');
function render(){
  document.getElementById('loading').style.display = 'none';
  root.innerHTML = '';
  items.forEach((it, idx) => {
    const d = document.createElement('div'); d.className = 'item';
    d.innerHTML = `
      <div class="meta"><span class="prompt">#${idx+1} ${escapeHtml(it.prompt)}</span>
        <span class="idx">${idx+1}/21</span></div>
      <div class="imgs">
        <figure><img src="${it.left}" alt="left" loading="lazy"><figcaption>左图</figcaption></figure>
        <figure><img src="${it.right}" alt="right" loading="lazy"><figcaption>右图</figcaption></figure>
      </div>
      <div class="q"><span class="qt">Q1 忠实度：哪张更符合文字描述？</span>
        ${opt(it.id,'faith','left','← 左图')}${opt(it.id,'faith','tie','相当')}${opt(it.id,'faith','right','右图 →')}
        <span class="done" data-d="${it.id}:faith"></span></div>
      <div class="q"><span class="qt">Q2 观感：哪张更好看？</span>
        ${opt(it.id,'look','left','← 左图')}${opt(it.id,'look','tie','相当')}${opt(it.id,'look','right','右图 →')}
        <span class="done" data-d="${it.id}:look"></span></div>`;
    root.appendChild(d);
  });
  refresh();
}
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function opt(id,q,val,label){
  const sel = (votes[id]||{})[q]===val ? ' sel' : '';
  return `<button class="opt${sel}" onclick="vote('${id}','${q}','${val}')">${label}</button>`;
}
function vote(id,q,val){
  votes[id] = votes[id] || {}; votes[id][q] = val; refresh();
}
function doneCount(){ return items.filter(it => (votes[it.id]||{}).faith && (votes[it.id]||{}).look).length; }
function refresh(){
  root.querySelectorAll('.opt').forEach(b => b.classList.remove('sel'));
  root.querySelectorAll('.done').forEach(s => s.textContent='');
  items.forEach(it => {
    const v = votes[it.id] || {};
    for (const q of ['faith','look']) {
      if (v[q]) {
        const el = root.querySelector(`[onclick="vote('${it.id}','${q}','${v[q]}')"]`);
        if (el) el.classList.add('sel');
        const done = root.querySelector(`[data-d="${it.id}:${q}"]`);
        if (done) done.textContent = '✓';
      }
    }
  });
  const n = doneCount();
  document.getElementById('prog').textContent = n === items.length ? `已完成 ${n}/${items.length}，可以提交了 ✓` : `已完成 ${n}/${items.length}`;
  document.getElementById('barfill').style.width = (items.length ? 100*n/items.length : 0)+'%';
  const btn = document.getElementById('submitBtn');
  if (submitted) { btn.style.display = 'none'; }
  else {
    btn.disabled = n !== items.length;
    btn.textContent = n === items.length ? '提交结果 ✓' : `提交结果（还差 ${items.length - n} 对）`;
    btn.classList.toggle('ready', n === items.length);
  }
}
function submitSurvey(){
  if (doneCount() !== items.length || submitting || submitted) return;
  if (!confirm('确认提交？提交后不可修改。')) return;
  submitting = true;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '提交中…';
  document.getElementById('errline').style.display = 'none';
  const answers = [];
  items.forEach(it => {
    const v = votes[it.id] || {};
    ['faith','look'].forEach(q => {
      answers.push({ id: it.id, q, answer: v[q], truth_left: it.truth.left, truth_right: it.truth.right });
    });
  });
  const payload = { nickname: (document.getElementById('who').value || '').slice(0, 30), answers };
  fetch(SUBMIT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
  })
  .then(r => r.json())
  .then(res => {
    submitting = false;
    if (res && res.ok) {
      submitted = true; exported = true;
      document.getElementById('doneBanner').style.display = 'block';
      document.getElementById('doneSeq').textContent = res.seq ? `你是第 ${res.seq} 位受访者。` : '';
      btn.style.display = 'none';
      document.getElementById('prog').textContent = '已全部提交 ✓';
    } else {
      btn.disabled = false; btn.textContent = '提交结果 ✓'; btn.classList.add('ready');
      showErr('提交失败：' + ((res && res.error) || '未知错误') + '。可重试，或点“导出 CSV”手动回传。');
    }
  })
  .catch(err => {
    submitting = false;
    btn.disabled = false; btn.textContent = '提交结果 ✓'; btn.classList.add('ready');
    showErr('网络错误，提交未成功：' + err.message + '。可重试，或点“导出 CSV”手动回传。');
  });
}
function showErr(msg){
  const e = document.getElementById('errline');
  e.textContent = msg; e.style.display = 'block';
}
function exportCSV(){
  let csv = 'id,prompt,q,answer,truth_left,truth_right\n';
  items.forEach(it => {
    const v = votes[it.id] || {};
    ['faith','look'].forEach(q => {
      if (v[q]) csv += `"${it.id}","${String(it.prompt).replace(/"/g,'""')}",${q},${v[q]},${it.truth.left},${it.truth.right}\n`;
    });
  });
  exported = true;
  const who = (document.getElementById('who').value || 'anon').replace(/[\\/:*?"<>|]/g,'_');
  const ts = new Date().toISOString().slice(0,19).replace(/[-:T]/g,'');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = `votes_${who}_${ts}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function reloadAll(){ location.reload(); }
window.addEventListener('beforeunload', e => {
  if (doneCount() > 0 && !exported) { e.preventDefault(); e.returnValue = ''; }
});
</script></body></html>
